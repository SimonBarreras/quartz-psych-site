<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IB Psychology Notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #161618;
      font-family: "Source Sans Pro", system-ui, sans-serif;
      color: #d4d4d4;
    }
    .gate {
      background: #1e1e20;
      border: 1px solid #393639;
      border-radius: 10px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #ebebec;
      margin-bottom: 0.4rem;
    }
    p {
      font-size: 0.875rem;
      color: #646464;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1px solid #393639;
      border-radius: 6px;
      background: #161618;
      color: #ebebec;
      font-size: 1rem;
      outline: none;
      margin-bottom: 0.85rem;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: #7b97aa; }
    button {
      width: 100%;
      padding: 0.6rem;
      background: #7b97aa;
      color: #161618;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #84a59d; }
    .error {
      margin-top: 0.75rem;
      font-size: 0.825rem;
      color: #e06c75;
      display: none;
    }
  </style>
</head>
<body>
  <div class="gate">
    <h1>IB Psychology Notes</h1>
    <p>Enter password to access notes</p>
    <label for="pw">Username:</label>
    <input type="text" id="pw" placeholder="" autofocus autocomplete="off" />
    <button onclick="check()">Enter</button>
    <div class="error" id="err">Incorrect password. Try again.</div>
  </div>
  <script>
    // Allow submitting with Enter key
    document.getElementById('pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') check();
    });

    function check() {
      var val = document.getElementById('pw').value;
      if (val === 'Mr. Latham') {
        sessionStorage.setItem('psych_auth', '1');
        window.location.replace('/quartz-psych-site/');
      } else {
        var err = document.getElementById('err');
        err.style.display = 'block';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
  </script>
</body>
</html>
